services:
  api-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATA_FILE: /app/data/cadastro.json
    volumes:
      - cadastro_data:/app/data
    expose:
      - "8000"

  api-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATA_FILE: /app/data/cadastro.json
    volumes:
      - cadastro_data:/app/data
    expose:
      - "8000"

  gateway:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  cadastro_data:

x-api: &api
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  env_file: .env
  expose: ["8000"]

services:
  api-1:
    <<: *api
  api-2:
    <<: *api
  gateway:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [api-1, api-2]
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
